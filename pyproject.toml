[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mystilink-lunar"
version = "0.1.0a3"
description = "Timezone-aware Chinese lunar calendar and sexagenary-cycle foundation for metaphysics engines"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Mystilink" }]
keywords = ["lunar", "calendar", "ganzhi", "solar-terms", "cli"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Utilities",
]
dependencies = [
  "sxtwl>=2.0.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
mystilink-lunar = "mystilink_lunar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mystilink_lunar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
